name: CI Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install
      - name: Run Backend Unit Tests
        working-directory: ./backend
        run: npm test

  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: backend-unit-tests
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install Frontend Dependencies
        run: npm install
      - name: Run Frontend Unit Tests
        run: npm test

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: frontend-unit-tests
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Build Docker Containers
        run: docker compose up -d --build
      - name: Run Integration Tests
        run: docker compose run --rm backend npm run test:integration
      - name: Tear Down
        run: docker compose down

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@v3
      - name: Build Docker Containers
        run: docker compose up -d --build
      - name: Run E2E Tests
        run: docker build -t e2e-test ./e2e && docker run --rm --network sdev-defrost-sprint3_default -e BASE_URL=http://frontend:5173 e2e-test
      - name: Tear Down
        run: docker compose down