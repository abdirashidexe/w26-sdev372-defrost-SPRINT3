name: Tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          npm install
          npm --prefix backend install
      - name: Run backend+integration suite (in test mode)
        run: npm --prefix backend run test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run frontend tests
        run: npm run test:frontend

  integration:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      db:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: defrost_app
          MYSQL_USER: defrostuser
          MYSQL_PASSWORD: impreza
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          npm install
          npm --prefix backend install
      - name: Start API and DB
        run: |
          docker compose up -d db api
      - name: Wait for API
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:3001/users/count >/dev/null && break
            sleep 2
          done
      - name: Run integration tests
        run: npm run test:integration
      - name: Tear down
        if: always()
        run: docker compose down

  e2e:
    needs: [integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Start entire stack
        run: docker compose up -d --build
      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:5173 >/dev/null && break
            sleep 2
          done
      - name: Prepare Playwright artifacts
        run: |
          sudo rm -rf test-results
          sudo mkdir -p test-results
      - name: Install Playwright browsers
        run: npx playwright install
      - name: Run E2E tests
        run: npm run test:e2e
      - name: Tear down
        if: always()
        run: docker compose down
