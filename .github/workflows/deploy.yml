name: Deploy

on:
  workflow_run:
    workflows: ["Test"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:deploy

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy on Orange Pi
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REPO_URL: https://github.com/abdirashidexe/w26-sdev372-defrost-sprint5.git
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no "${DEPLOY_USER}@${DEPLOY_HOST}" "
            set -eu
            mkdir -p \$(dirname \"${DEPLOY_PATH}\")
            if [ ! -d \"${DEPLOY_PATH}/.git\" ]; then
              git clone \"${REPO_URL}\" \"${DEPLOY_PATH}\"
            fi
            cd \"${DEPLOY_PATH}\"
            git fetch origin main
            git checkout -B main origin/main
            git pull --ff-only origin main
            if [ ! -f .env ]; then
              echo '.env is missing on the server. Create it at ${DEPLOY_PATH}/.env and rerun deploy.' >&2
              exit 1
            fi
            docker compose down
            docker compose up -d --build
          "
