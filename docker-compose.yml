services:
  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: defrost_app
      MYSQL_USER: defrostuser
      MYSQL_PASSWORD: impreza
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build: ./backend
    ports:
      - "3001:3000"
    environment:
      DB_HOST: db
      DB_USER: defrostuser
      DB_PASSWORD: impreza
      DB_NAME: defrost_app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:5173"
    environment:
      - HOST=0.0.0.0
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - VITE_PIRATE_WEATHER_KEY=${VITE_PIRATE_WEATHER_KEY}
    depends_on:
      - api

  tests:
    image: mcr.microsoft.com/playwright:v1.58.2-noble
    working_dir: /app
    volumes:
      - .:/app
    command: >
      sh -c "npm ci &&
             cd backend &&
             npm ci &&
             cd .. &&
             until curl -sf http://frontend:5173 >/dev/null; do sleep 1; done &&
             npm run test"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
      frontend:
        condition: service_started
    environment:
      - DB_HOST=db
      - DB_USER=defrostuser
      - DB_PASSWORD=impreza
      - DB_NAME=defrost_app
      - PLAYWRIGHT_BASE_URL=http://frontend:5173
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright

volumes:
  db_data:
